<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título -->
    <title>Beehave Marketing Digital</title>

    <!-- Descrição -->
    <meta
      name="description"
      content="Somos uma Agência de Marketing Digital focada em resultados para pequenas e médias empresas."
    />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Cor do navegador -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:title" content="Beehave Marketing Digital" />
    <meta
      property="og:description"
      content="Somos uma Agência de Marketing Digital focada em resultados para pequenas e médias empresas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://beehavemarketing.com.br" />
    <meta property="og:image" content="https://beehavemarketing.com.br/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beehave Marketing Digital" />
    <meta
      name="twitter:description"
      content="Somos uma Agência de Marketing Digital focada em resultados."
    />
    <meta name="twitter:image" content="https://beehavemarketing.com.br/logo.png" />

    <!-- Dados estruturados para o Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Beehave Marketing",
      "url": "https://beehavemarketing.com.br",
      "logo": "https://beehavemarketing.com.br/logo.png"
    }
    </script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bunday+Clean+Heavy+UP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
